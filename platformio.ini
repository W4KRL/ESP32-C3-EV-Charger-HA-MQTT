; ════════════════════════════════════════════════════════════════════════════
; platformio.ini — ESP32-C3 EV Charger AC Power Monitor (HA / MQTT)
; ════════════════════════════════════════════════════════════════════════════
;
; Repository : W4KRL/ESP32-C3-EV-Charger-HA-MQTT
; Target     : ESP32-C3 SuperMini (uses esp32-c3-devkitm-1 board definition)
; Framework  : Arduino (espressif32 platform)
; Author     : Karl Berger with Claude
; Date       : 2026.11.22
;
; Environments
; ────────────
;   esp32-c3-devkitm-1  (default)  Serial upload over the native USB-CDC port.
;                                  Use on the bench, and for CALIBRATE mode
;                                  (see config.h).
;   esp32-c3-ota                   Wireless upload via ArduinoOTA (espota).
;                                  Inherits every setting from the serial
;                                  environment; overrides upload method only.
;
; Build notes
; ───────────
;   - ARDUINO_USB_CDC_ON_BOOT=1 / ARDUINO_USB_MODE=1 route Serial to the C3's
;     built-in USB-CDC port (the SuperMini has no USB-UART bridge chip).
;   - monitor_rts / monitor_dtr = 0 keep the serial monitor from holding the
;     C3 in reset or download mode when it opens the port.
;   - C++17 replaces the toolchain's default gnu++11 (needed for inline
;     variables in config.h).
;   - Exceptions disabled to save flash; no code path uses try/catch.
;
; OTA notes
; ─────────
;   - upload_port is the monitor's IP address, not ac-monitor-01.local.
;     Windows does not reliably resolve mDNS (.local) names for espota.
;     Keep a DHCP reservation for this address in the router.
;   - --auth must match OTA_PASSWORD in secrets.h exactly. The value below is
;     literal text, not a reference to the #define.
;   - espota needs the monitor to connect back to this PC. On Windows, allow
;     %USERPROFILE%\.platformio\penv\Scripts\python.exe through the firewall
;     on Private networks, and set the home network profile to Private.
;
; Secrets
; ───────
;   include/secrets.h (Wi-Fi, MQTT, OTA credentials) is gitignored and must be
;   created locally from the template at the bottom of config.h.
;
; ════════════════════════════════════════════════════════════════════════════

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600
build_unflags =
    -std=gnu++11
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
    -fno-exceptions

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.2
    sstaub/TickTwo@^4.4.0

[env:esp32-c3-ota]
extends = env:esp32-c3-devkitm-1
upload_protocol = espota
;upload_port = ac-monitor-01.local
upload_port = 192.168.0.201
upload_flags = --auth=ota_password